site_name: GnuCash for Mere Mortals
site_description: Proper double-entry bookkeeping for a household or a tiny business. GnuCash keeps your accounts in one book where every payment has a source and a destination, and this guide builds a small book for real, checks that it balances two independent ways, and states the limits plainly.
